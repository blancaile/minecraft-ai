plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.23'
}

version = '0.2.0'
group = 'io.github.blancaile'
base { archivesName = 'jev-control-paper' }

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    paperweight.paperDevBundle('1.21.11-R0.1-20260215.191825-75')
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}
test { useJUnitPlatform() }
jar {
    manifest { attributes('paperweight-mappings-namespace': 'mojang') }
    from('THIRD_PARTY_NOTICES.md')
}
paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()
