name: Jev control build and server smoke
on:
  push:
    branches: [feat/jev-embodied-control]
  pull_request:
    paths: ['src/**', 'build.gradle', 'settings.gradle', 'gradle/**', 'gradlew*', 'tools/**', '.github/skills/**', '.github/workflows/jev-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distributable and unit tests
        run: ./gradlew --no-daemon clean build
      - name: Reject temporary diagnostic statements
        run: '! grep -R -E "RUNTIME-DIAG|HARNESS-DIAG" src/main'
      - name: Verify deployment failure handling without a remote server
        shell: pwsh
        run: ./tools/runtime/test-remote.ps1
      - name: Boot production JAR and verify fake player without Jev credentials
        run: python3 tools/ci/server_smoke.py build/libs/jev-control-paper-0.2.0.jar
      - name: Verify acceptance evidence validator offline
        run: python3 -m unittest discover -s tools/runtime -p test_paper_acceptance.py
      - name: Verify P1 acceptance evidence validator offline
        run: python3 -m unittest discover -s tools/runtime -p test_p1_acceptance.py
      - name: Install segment schema validator
        run: python3 -m pip install -r tools/runtime/requirements.txt
      - name: Verify P1b acceptance evidence validator offline
        run: python3 -m unittest discover -s tools/runtime -p test_p1b_acceptance.py
      - name: Verify shared P1b receipt bindings offline
        run: python3 -m unittest discover -s tools/runtime -p test_shared_p1b.py
      - name: Inject runtime faults on isolated Paper without real API credentials
        run: python3 tools/runtime/paper_acceptance.py --mode faults --execute
      - name: Verify bounded assisted segments on isolated Paper with mock choices
        run: python3 tools/runtime/p1b_acceptance.py --phase smoke --execute
      - name: Upload JAR and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-control-build-and-smoke
          include-hidden-files: true
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build/test-results/test/
            .runtime-harness/paper-smoke-*/console.log
            .runtime-harness/paper-smoke-*/verification.json
            .runtime-harness/paper-smoke-*/plugins/JevControl/traces/
            .runtime-harness/paper-smoke-*/plugins/JevControl/receipts/
            .runtime-harness/paper-faults-*/console.log
            .runtime-harness/paper-faults-*/plan.json
            .runtime-harness/paper-faults-*/verification.json
            .runtime-harness/paper-faults-*/plugins/JevControl/traces/
            .runtime-harness/paper-faults-*/plugins/JevControl/receipts/
            .runtime-harness/p1b-smoke-*/console.log
            .runtime-harness/p1b-smoke-*/plan.json
            .runtime-harness/p1b-smoke-*/verification.json
            .runtime-harness/p1b-smoke-*/plugins/JevControl/traces/
            .runtime-harness/p1b-smoke-*/plugins/JevControl/receipts/
