name: Jev control build and server smoke
on:
  push:
    branches: [feat/jev-embodied-control]
  pull_request:
    paths: ['src/**', 'build.gradle', 'settings.gradle', 'gradle/**', 'gradlew*', 'tools/ci/**', '.github/workflows/jev-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distributable and unit tests
        run: ./gradlew --no-daemon clean build
      - name: Boot production JAR and verify fake player without Jev credentials
        run: python3 tools/ci/server_smoke.py build/libs/jev-control-0.1.0.jar
      - name: Upload JAR and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-control-build-and-smoke
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build/test-results/test/
            build/server-smoke/console.log
            build/server-smoke/verification.json
            build/server-smoke/logs/jev-control/
